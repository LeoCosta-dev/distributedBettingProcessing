services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wagering}
      POSTGRES_USER: ${POSTGRES_USER:-wagering}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wagering}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-wagering} -d ${POSTGRES_DB:-wagering}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  localstack:
    image: docker.io/localstack/localstack:4.8
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - localstack_data:/var/lib/localstack
      - ./infra/localstack/init:/etc/localstack/init/ready.d:ro,Z
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fs http://localhost:4566/_localstack/health
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8082}:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro,Z
    healthcheck:
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: dockerfile
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_NAME: ${APP_NAME:-distributedBettingProcessing}
      HTTP_ADDR: ${HTTP_ADDR:-:8080}

      DATABASE_URL: postgres://${POSTGRES_USER:-wagering}:${POSTGRES_PASSWORD:-wagering}@postgres:5432/${POSTGRES_DB:-wagering}?sslmode=disable

      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      SQS_WAGER_QUEUE: ${SQS_WAGER_QUEUE:-wager-transactions.fifo}
      SQS_WAGER_DLQ: ${SQS_WAGER_DLQ:-wager-transactions-dlq.fifo}

      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-wagering}
      KEYCLOAK_ISSUER_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM:-wagering}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-wagering-api}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:-change-me}

      SQS_VISIBILITY_TIMEOUT_SECONDS: ${SQS_VISIBILITY_TIMEOUT_SECONDS:-30}
      SQS_MAX_RECEIVE_COUNT: ${SQS_MAX_RECEIVE_COUNT:-5}

      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-1s}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-20}

      REFERENCE_POLL_INTERVAL: ${REFERENCE_POLL_INTERVAL:-1s}
      REFERENCE_MAX_ATTEMPTS: ${REFERENCE_MAX_ATTEMPTS:-10}

      LOG_LEVEL: ${LOG_LEVEL:-info}

    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      keycloak:
        condition: service_healthy

    ports:
      - "${HTTP_PORT:-8080}:8080"

  stack-ready:
    image: docker.io/library/alpine:3.22
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        echo ""
        echo "=================================================="
        echo " Distributed Betting Processing"
        echo " Local infrastructure initialized successfully"
        echo "=================================================="
        echo " PostgreSQL : HEALTHY"
        echo " LocalStack : HEALTHY"
        echo " SQS Queues : READY"
        echo " Keycloak   : HEALTHY"
        echo " Realm      : wagering"
        echo " App        : STARTED (health endpoint pending)"
        echo "=================================================="
        echo ""

volumes:
  postgres_data:
  localstack_data:
